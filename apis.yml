description: >-
  Polaris Inc. (NYSE: PII), long known as Polaris Industries, is a Minnesota-based global
  manufacturer of powersports and off-road vehicles. Its portfolio spans RANGER, RZR,
  Polaris XPEDITION and GENERAL side-by-sides, Sportsman ATVs, snowmobiles, Slingshot
  moto-roadsters, military and commercial off-road vehicles, Aixam quadricycles, Goupil
  electric utility vehicles, and Bennington and Godfrey pontoon and deck boats. Its
  connected-vehicle platform, RIDE COMMAND, ships in-dash navigation and vehicle telematics
  to riders as an end-user product. Polaris completed the separation of Indian Motorcycle
  and the sale of a majority stake to Carolwood LP on 2 February 2026. Polaris publishes no
  public API, developer portal or machine-readable specification; the only credentialed
  integration surface a member of the public can find is the dealer portal at
  polarisportal.com, which authenticates against an Auth0 tenant.
